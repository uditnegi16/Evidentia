[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidentia"
version = "0.1.0"
description = "Config-driven engine for controlled, traceable regulatory reports"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# scripts/ holds throwaway diagnostics, not shipped library code.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ISC"]
# N999 fires on the repo directory name (Evidentia) rather than on any module
# we control. The package itself is correctly named `evidentia`.
ignore = ["N999"]
