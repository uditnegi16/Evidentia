name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -v --tb=short

# No secrets and no dataset are required here. The ground-truth tests skip
# themselves when the data file is absent, and the deterministic analysis layer
# holds no API calls — so the whole pipeline below the LLM boundary is verifiable
# in CI with nothing but the source tree.
